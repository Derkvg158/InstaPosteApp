name: Instagram - posts plaatsen

on:
  schedule:
    # Elk half uur (UTC; GitHub kan een paar minuten vertraagd zijn).
    # Houdt ook het gratis Supabase-project actief.
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Alleen controleren, niets plaatsen'
        type: boolean
        default: true

permissions:
  contents: read

# Nooit twee runs tegelijk.
concurrency:
  group: instagram-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Posts plaatsen
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          SUPABASE_URL: https://kcbjlmgbahpletdieyah.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            node scripts/publish.mjs --dry-run
          else
            node scripts/publish.mjs
          fi
