name: Instagram - posts plaatsen

on:
  schedule:
    # Elk half uur (UTC; GitHub kan een paar minuten vertraagd zijn).
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Alleen controleren, niets plaatsen'
        type: boolean
        default: true

permissions:
  contents: write

# Nooit twee runs tegelijk, anders kan een post dubbel geplaatst worden.
concurrency:
  group: instagram-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Posts plaatsen
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            node scripts/publish.mjs --dry-run
          else
            node scripts/publish.mjs
          fi

      - name: posts.json terug committen
        # Ook als een post mislukt is, zodat de status "mislukt" wordt opgeslagen.
        if: always()
        run: |
          if git diff --quiet -- posts.json; then
            echo "Geen wijzigingen in posts.json."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts.json
          git commit -m "Instagram: status posts bijgewerkt"
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 5
          done
          echo "::error::Kon posts.json niet pushen. Controleer handmatig of de posts geplaatst zijn, anders worden ze bij de volgende run opnieuw geplaatst."
          exit 1
